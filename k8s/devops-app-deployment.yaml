apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: ghcr.io/andrzejpusty/devops-app:prod
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "devops-app-k8s"
            - name: APP_ENV
              value: "kubernetes"
            - name: APP_VERSION
              value: "k8s-test"
